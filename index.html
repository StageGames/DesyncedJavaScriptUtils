<!DOCTYPE html>
<html>
<head>
<title>Desynced JavaScript Utilities</title>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<link rel="icon" href="//www.desyncedgame.com/desynced.ico">
<style>
body { background-color: #111827; color: white; font-family: sans-serif; margin: 0 }
h1, h2, p { text-align: center; margin: 15pt }
table { border-collapse: collapse; margin:auto }
td, th { border:1px solid black; padding: 4pt; word-wrap: break-word; }
th { background-color: #303946 }
td { background-color: #1f2937 }
a { color: #83acf2; text-decoration: none }
a:hover { color: #f26c43 }
</style>

<body>
<h1>Desynced JavaScript Utilities</h1>
<p>JavaScript utilities that can interact/interoperate with Desynced. Check out the <a href="https://github.com/StageGames/DesyncedJavaScriptUtils/">source on GitHub</a>!</p>

<h2>Desynced Decoder & Encoder</h2>
<table style="margin-bottom:10pt">
<tr><th style="padding:6pt">Input String</th></tr>
<tr><td style="padding:6pt"><textarea type="text" id="inp" rows=5 cols=120></textarea></td></tr>
<tr><th style="padding:6pt">Convert to or from JSON</th></tr>
<tr><td style="padding:6pt"><button style="width:100%;height:4em" onclick="run();">Convert to or from JSON</button></td></tr>
<tr><th style="padding:6pt">Output</th></tr>
<tr><td style="padding:6pt">Type:<br><input id="typ" style="width:100%"/><br>Result</br><textarea type="text" id="outp" rows=24 cols=120 readonly></textarea></td></tr>
<tr><th style="padding:6pt">Search</th></tr>
<tr><td style="padding:6pt">Subroutine:<br><input id="search_sub" style="width:100%"/></td></tr>
<tr><td style="padding:6pt">Instruction:<br><input id="search_op" style="width:100%"/></td></tr>
<tr><td style="padding:6pt">Comment:<br><input id="search_cmt" style="width:100%"/></td></tr>
<tr><td style="padding:6pt">Number:<br><input id="search_num" style="width:100%"/></td></tr>
<tr><td style="padding:6pt"><button style="width:100%;height:4em" onclick="search();">Search</button></td></tr>
<tr><th style="padding:6pt">Results</th></tr>
<tr><td style="padding:6pt"><textarea type="text" id="srchres" rows=24 cols=120 readonly></textarea></tr>
</table>

<script src="dsconvert.js" type="text/javascript"></script>
<script type="text/javascript">
let jsonobj = null;
function run()
{
	var str = document.getElementById('inp').value;
	jsonobj = null;
	try { jsonobj = JSON.parse(str); } catch { }
	try
	{
		if (!jsonobj)
		{
			var info = {};
			jsonobj = DesyncedStringToObject(str, info);
			document.getElementById('outp').value = JSON.stringify(jsonobj, null, 4);
			document.getElementById('typ').value = info.type + " (" + (info.type == "B" ? "BLUEPRINT" : (info.type == "C" ? "BEHAVIOR" : (info.type == "R" ? "REGISTER" : "UNKNOWN"))) + ")";
		}
		else
		{
			var type = (document.getElementById('typ').value[0] || (jsonobj[0] ? 'C' : 'B')); // simple guess
			document.getElementById('outp').value = ObjectToDesyncedString(jsonobj, type);
			document.getElementById('typ').value = type + " (" + (type == "B" ? "BLUEPRINT" : (type == "C" ? "BEHAVIOR" : (type == "R" ? "REGISTER" : "UNKNOWN"))) + ")";
		}
	}
	catch (e)
	{
		document.getElementById('outp').value = "ERROR: " + e.message;
		document.getElementById('typ').value = "";
	}

	document.getElementById('srchres').value = "";
}

function search()
{
	if (!jsonobj)
		return;

	let result = "";

	let sub_name = document.getElementById('search_sub').value.toLowerCase();
	if(sub_name)
	{
		let words = sub_name.split(' ');

		let subs = [];
		for (let i = 0; i < jsonobj.dependencies.length; ++i)
		{
			let name = jsonobj.dependencies[i].name.toLowerCase();
			if (name == sub_name)
			{
				subs = [i];
				break;
			}
			else if (match_words(name, words))
				subs.push(i);
		}

		for (let s of subs)
		{
			if (result)
				result += "\n";
			result += "Subroutine: " + jsonobj.dependencies[s].name + "\n";
			if (search_sub_calls(jsonobj, s))
				result += "Used in " + jsonobj.name + "\n";
			if (jsonobj.dependencies)
			{
				for (let d of jsonobj.dependencies)
				{
					let count = search_sub_calls(d, s);
					if (count > 0)
						result += "Used in " + d.name + " (" + count + " occurrences)\n";
				}
			}
		}
	}

	let op = document.getElementById('search_op').value;
	if (op)
	{
		let count = search_instruction(jsonobj, op);
		if(count>0)
			result += jsonobj.name + ": " + count + " occurrences\n";

		if (jsonobj.dependencies)
		{
			for (let d of jsonobj.dependencies)
			{
				let count = search_instruction(d, op);
				if(count>0)
					result += d.name + ": " + count + " occurrences\n";
			}
		}
	}

	let comment = document.getElementById('search_cmt').value.toLowerCase();
	if (comment)
	{
		let words = comment.split(' ');
		for (let c of search_comment(jsonobj, words))
			result += "Comment: " + c + "\n";

		if (jsonobj.dependencies)
		{
			for (let d of jsonobj.dependencies)
			{
				let cmts = search_comment(d, words);
				if (cmts.length > 0)
				{
					if (result)
						result += "\n";

					result += "Subroutine: " + d.name + "\n";
					for (let c of cmts)
						result += "Comment: " + c + "\n";
				}
			}
		}
	}

	let expr = document.getElementById('search_num').value;
	if (expr)
	{
		let words = expr.split(' ');
		let predicate = null;
		if (words.length == 1)
		{
			let num = Number(words[0]);
			predicate = n => n == num;
		}
		else
		{
			for (let i = 0; i + 1 < words.length; i += 2)
			{
				let num = Number(words[i+1]);
				let p = null;
				if (words[i] == '>')
					p = n => n > num;
				else if (words[i] == '>=')
					p = n => n >= num;
				else if (words[i] == '<')
					p = n => n < num;
				else if (words[i] == '<=')
					p = n => n <= num;
				else if (words[i] == '==')
					p = n => n == num;
				else if (words[i] == '!=')
					p = n => n != num;
				if (p)
				{
					let old = predicate;
					if (old)
						predicate = n => old(n) && p(n)
					else
						predicate = p
				}
			}
		}

		let nums = search_number(jsonobj, predicate);
		for (let n of nums)
			result += "Number: " + n + "\n";

		if (jsonobj.dependencies)
		{
			for (let d of jsonobj.dependencies)
			{
				nums = search_number(d, predicate);
				if (nums.length > 0)
				{
					if (result)
						result += "\n";

					result += "Subroutine: " + d.name + "\n";
					for (let n of nums)
						result += "Number: " + n + "\n";
				}
			}
		}
	}

	document.getElementById('srchres').value = result;
}

function match_words(text, words)
{
	for (let w of words)
		if (text.indexOf(w) < 0)
			return false;
	return true;
}

function search_sub_calls(behaviour, sub)
{
	let count = 0;
	for (let key in behaviour)
	{
		let inst = behaviour[key];
		if (inst.op === "call" && inst.sub == sub + 1)
			++count;
	}

	return count;
}

function search_instruction(behaviour, op)
{
	let count = 0;
	for (let key in behaviour)
	{
		let inst = behaviour[key];
		if (inst.op === op)
			++count;
	}

	return count;
}

function search_comment(behaviour, words)
{
	let comments = [];
	for (let key in behaviour)
	{
		let inst = behaviour[key];
		if (inst.op && inst.cmt && match_words(inst.cmt.toLowerCase(), words))
			comments.push(inst.cmt);
	}
	return comments;
}

function search_number(behaviour, predicate)
{
	let nums = [];
	for (let key in behaviour)
	{
		let inst = behaviour[key];
		if (inst.op)
		{
			for (let k2 in inst)
			{
				let param = inst[k2];
				if(param.num && predicate(param.num))
					nums.push(param.num + " in instruction " + inst.op + " (param " + k2 + ")");
			}
		}
	}
	return nums;
}
</script>
